version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: jalanyuk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jalanyuk
      POSTGRES_PASSWORD: jalanyuk123
      POSTGRES_DB: jalanyuk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalanyuk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment below to run backend service in Docker
