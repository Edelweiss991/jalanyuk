databases:
  - name: jalanyuk-db
    plan: free
    databaseName: jalanyuk_db
    user: jalanyuk

services:
  - type: web
    name: jalanyuk-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build && make -C ../algorithms-c && DATABASE_URL=$DIRECT_URL npx prisma db seed
    startCommand: node dist/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@jalanyuk.id
      - key: ADMIN_PASSWORD
        value: admin123
      - key: CUSTOMER_EMAIL
        value: demo@jalanyuk.id
      - key: CUSTOMER_PASSWORD
        value: demo123
